<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>write · llui2</title>
  <meta name="description" content="A browser writing surface with text statistics.">
  <link rel="canonical" href="https://llui2.github.io/write/">
  <link rel="icon" type="image/png" href="/images/window.png">
  <link rel="apple-touch-icon" href="/images/window.png">
  <link rel="stylesheet" href="../style.css?v=20260726-2">
</head>
<body>
  <div data-include="/includes/header.html"></div>

  <main>
    <section class="write-container">
      <div class="write-editor-col">
        <div class="write-controls">
          <label class="write-control">
            Font size:
            <input type="range" id="fontSize" min="14" max="26" value="16" step="1">
            <span id="fontSizeValue">16px</span>
          </label>
          <label class="write-control">
            Font family:
            <select id="fontFamily">
              <option value="system">System</option>
              <option value="serif">Serif</option>
              <option value="mono">Mono</option>
            </select>
          </label>
        </div>
        <textarea id="writeEditor" placeholder="Start writing..." aria-label="Text editor"></textarea>
        <div class="write-word-count" aria-live="polite">
          <span id="wordCount">0</span>
          <span id="wordCountLabel" class="write-word-count-label">words</span>
        </div>
      </div>

      <div class="write-analysis">
        <section class="write-zipf" aria-label="Word frequency rank plot">
          <div class="zipf-chart-wrap">
            <canvas id="zipfChart" role="img" aria-label="Word frequency rank plot"></canvas>
            <div id="zipfTooltip" class="zipf-tooltip" hidden></div>
          </div>
        </section>

        <section class="write-word-info" aria-label="Word information">
          <div id="densityContainer">
            <table id="densityTable" aria-label="Word frequencies with word, rank, and frequency columns">
              <colgroup>
                <col class="col-word">
                <col class="col-rank">
                <col class="col-count">
              </colgroup>
              <thead>
                <tr>
                  <th>Word</th>
                  <th>Rank</th>
                  <th>Frequency</th>
                </tr>
              </thead>
              <tbody id="densityList" aria-live="polite"></tbody>
            </table>
          </div>
        </section>
      </div>
    </section>
  </main>

  <div data-include="/includes/footer.html"></div>

  <script src="../script.js"></script>
  <script src="write.js?v=20260726-1"></script>
</body>
</html>
