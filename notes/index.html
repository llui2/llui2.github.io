<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>notes · llui2</title>
  <meta name="description" content="Notes from Lluís Torres-Hugas.">
  <link rel="canonical" href="https://llui2.github.io/notes/">

  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div data-include="/includes/header.html"></div>

  <main>
    <section class="notes-shell">
      <nav class="notes-sidebar" aria-label="Notes">

        data-notes-reader

        data-notes-default="blank.md"
        aria-live="polite"
      >
      </article>
    </section>
  </main>

  <div data-include="/includes/footer.html"></div>

  <script src="../script.js"></script>
